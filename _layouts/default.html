<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #0f1724; --card: #0b1220; --text: #e6eef6; --accent: #6ee7b7;
      --muted: #94a3b8; --maxw: 960px;
    }

<script>
  const toggle = document.getElementById('theme-toggle');
  const currentTheme = localStorage.getItem('theme');
  if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  toggle.addEventListener('click', () => {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  });
</script>
    
    
    body {
      margin: 0; font-family: Inter, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    a { color: var(--accent); text-decoration: none; }
    header, footer { text-align: center; padding: 1rem 0; color: var(--muted); }
    main { max-width: var(--maxw); margin: auto; padding: 2rem; }
    .hero { text-align: center; margin: 3rem 0; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: .5rem; }
    p.lead { color: var(--muted); font-size: 1.1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 2rem; }
    .card { background: var(--card); padding: 1.5rem; border-radius: 10px; }
  </style>
      <!-- Font Awesome for social icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <header>
    <h2>{{ site.title }}</h2>
    <p>{{ site.description }}</p>

    #Navigation start
    <nav>
      <ul>
        {% for item in site.nav %}
          <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    #Nav end
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ "now" | date: "%Y" }} {{ site.title }} — built with Jekyll
  </footer>
</body>
</html>
